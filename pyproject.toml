[project]
name = "mediawaiter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
    "pyjwt>=2.10.1",
    "requests>=2.32.3",
    "secure>=0.3.0",
]

[dependency-groups]
dev = [
    "bpython>=0.25",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "pdbpp<1.0.0,>=0.9.15",
    "mock<3.0,>=2.0",
    "bandit<2.0,>=1.5",
    "coverage<5.0,>=4.5",
    "diff-cover<3.0,>=2.0",
    "ruff>=0.16.2",
]

[project.scripts]
mw = "src.mediawaiter.main:main"

[tool.pytest.ini_options]
addopts = "--ignore=result"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
